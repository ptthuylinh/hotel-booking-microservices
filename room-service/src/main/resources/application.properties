spring.application.name=room-service
server.port=8080

# Cấu hình DataSource kết nối RDS PostgreSQL room_db:
# Hỗ trợ cả SPRING_DATASOURCE_URL trực tiếp hoặc các biến môi trường DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:room_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:room_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:room_password}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate ddl-auto update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Actuator Health Check cho ALB và ECS giám sát
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
