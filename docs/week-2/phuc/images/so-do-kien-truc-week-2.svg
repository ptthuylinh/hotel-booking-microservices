<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1280" viewBox="0 0 1400 1280"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker></defs><rect width="1400" height="1280" fill="white"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#172b4d;font-size:17px}.title{font-size:28px;font-weight:bold}.section{font-size:20px;font-weight:bold}.small{font-size:15px}</style><text x="700" y="42" class="title" text-anchor="middle">Hotel Booking — Triển khai và kiểm thử Week 2</text><text x="700" y="73" class="" text-anchor="middle">AWS Learner Lab • us-east-1 • Sơ đồ tại thời điểm hệ thống chạy kiểm thử</text><rect x="530" y="100" width="340" height="55" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="700.0" y="128" class="" text-anchor="middle">Client / Postman</text><polyline points="700,155 700,200" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="775" y="183" class="small" text-anchor="middle">HTTP :80</text><rect x="25" y="195" width="1350" height="670" rx="16" fill="#f8fafc" stroke="#64748b"/><text x="50" y="226" class="section" text-anchor="start">VPC — Public ALB / ECS trong hai private subnet</text><rect x="405" y="248" width="590" height="80" rx="10" fill="#e0f2fe" stroke="#94a3b8" stroke-width="1.5"/><text x="700.0" y="276" class="" text-anchor="middle">Application Load Balancer • HTTP listener :80</text><text x="700.0" y="300" class="" text-anchor="middle">3 target group IP :8080 • /actuator/health</text><rect x="55" y="248" width="305" height="80" rx="10" fill="#fff7ed" stroke="#94a3b8" stroke-width="1.5"/><text x="207.5" y="276" class="" text-anchor="middle">NAT Gateway (tạm)</text><text x="207.5" y="300" class="" text-anchor="middle">Egress tải image / gọi AWS API</text><text x="207" y="351" class="small" text-anchor="middle">Đã gỡ NAT + Elastic IP sau kiểm thử</text><polyline points="700,328 700,350 250,350 250,405" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="250" y="383" class="small" text-anchor="middle">/api/rooms*</text><polyline points="700,328 700,350 700,350 700,405" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="700" y="383" class="small" text-anchor="middle">/api/bookings*</text><polyline points="700,328 700,350 1150,350 1150,405" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="1150" y="383" class="small" text-anchor="middle">/api/notifications*</text><rect x="85" y="405" width="330" height="88" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/><text x="250.0" y="433" class="" text-anchor="middle">room-service • Fargate :8080</text><text x="250.0" y="457" class="" text-anchor="middle">hotel-room-service:v1.0.0</text><text x="250.0" y="481" class="" text-anchor="middle">Quản lý phòng</text><rect x="535" y="405" width="330" height="88" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/><text x="700.0" y="433" class="" text-anchor="middle">booking-service • Fargate :8080</text><text x="700.0" y="457" class="" text-anchor="middle">hotel-booking-service:v1.0.0</text><text x="700.0" y="481" class="" text-anchor="middle">Đặt phòng / phát sự kiện</text><rect x="985" y="405" width="330" height="88" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/><text x="1150.0" y="433" class="" text-anchor="middle">notification-service • :8080</text><text x="1150.0" y="457" class="" text-anchor="middle">hotel-notification-service:v1.0.0</text><text x="1150.0" y="481" class="" text-anchor="middle">Email mô phỏng bằng log</text><polyline points="535,450 415,450" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="475" y="435" class="small" text-anchor="middle">REST nội bộ</text><rect x="470" y="535" width="460" height="76" rx="10" fill="#f3e8ff" stroke="#94a3b8" stroke-width="1.5"/><text x="700.0" y="563" class="" text-anchor="middle">Route 53 private hosted zone: hotel.local</text><text x="700.0" y="587" class="" text-anchor="middle">room-service.hotel.local → private IP room task</text><polyline points="700,493 700,535" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="743" y="521" class="small" text-anchor="middle">DNS</text><text x="700" y="638" class="small" text-anchor="middle">Bản ghi A được cập nhật khi chạy resume-lab.py; chưa tự động theo task IP</text><rect x="85" y="675" width="780" height="110" rx="10" fill="#fef9c3" stroke="#94a3b8" stroke-width="1.5"/><text x="475.0" y="703" class="" text-anchor="middle">Amazon RDS PostgreSQL • hotel-db-instance</text><text x="475.0" y="727" class="" text-anchor="middle">room_db / room_user                    booking_db / booking_user</text><text x="475.0" y="751" class="" text-anchor="middle">Hai database, user và quyền truy cập riêng</text><polyline points="250,493 250,675" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="316" y="580" class="small" text-anchor="middle">JDBC :5432</text><polyline points="865,480 955,480 955,655 850,655 850,675" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="910" y="674" class="small" text-anchor="middle">JDBC :5432</text><text x="700" y="826" class="small" text-anchor="middle">ECS: awsvpc • Linux x86_64 • CPU 256 • RAM 512 MiB • LabRole • Không public IP</text><text x="700" y="851" class="small" text-anchor="middle">ALB default rule: fixed response 404 • ECS nhận :8080 từ ALB SG và ECS SG</text><rect x="45" y="925" width="295" height="80" rx="10" fill="#e0f2fe" stroke="#94a3b8" stroke-width="1.5"/><text x="192.5" y="953" class="" text-anchor="middle">DynamoDB audit log</text><text x="192.5" y="977" class="" text-anchor="middle">hotel-booking-audit-logs</text><rect x="425" y="925" width="285" height="80" rx="10" fill="#fce7f3" stroke="#94a3b8" stroke-width="1.5"/><text x="567.5" y="953" class="" text-anchor="middle">SNS topic</text><text x="567.5" y="977" class="" text-anchor="middle">hotel-booking-events</text><rect x="795" y="925" width="285" height="80" rx="10" fill="#fce7f3" stroke="#94a3b8" stroke-width="1.5"/><text x="937.5" y="953" class="" text-anchor="middle">SQS main queue</text><text x="937.5" y="977" class="" text-anchor="middle">booking-notification-queue</text><rect x="1110" y="925" width="245" height="80" rx="10" fill="#fff7ed" stroke="#94a3b8" stroke-width="1.5"/><text x="1232.5" y="953" class="" text-anchor="middle">SQS DLQ</text><text x="1232.5" y="977" class="" text-anchor="middle">booking-notification-dlq</text><polyline points="192,865 192,925" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="207" y="905" class="small" text-anchor="middle">Booking ghi audit (PutItem)</text><polyline points="568,865 568,925" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="620" y="905" class="small" text-anchor="middle">Booking publish sự kiện</text><polyline points="710,965 795,965" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="752" y="950" class="small" text-anchor="middle">Raw</text><polyline points="1080,965 1110,965" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="1233" y="1040" class="small" text-anchor="middle">Redrive maxReceiveCount = 3</text><polyline points="1150,493 1338,493 1338,880 1035,880 1035,925" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="1110" y="715" class="small" text-anchor="middle">Notification: ReceiveMessage / DeleteMessage (ACK)</text><rect x="45" y="1095" width="1310" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="700.0" y="1123" class="" text-anchor="middle">Hỗ trợ: ECR lưu image • Secrets Manager cấp thông tin DB • CloudWatch Logs theo dõi ba service</text><text x="700.0" y="1147" class="" text-anchor="middle">Sau kiểm thử: ECS desired/running = 0 • RDS và EC2 quản trị đã dừng • NAT/EIP tạm đã gỡ</text><text x="700" y="1222" class="small" text-anchor="middle">Luồng đặt phòng: kiểm tra/giữ phòng → lưu booking → ghi audit → publish SNS → SQS → notification</text></svg>